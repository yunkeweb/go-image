name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run Tests & Vet
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Go Proxy & Sumdb Indexing
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Triggering proxy for version: $TAG_NAME"
          curl -s "https://proxy.golang.org/github.com/yunkeweb/go-image/@v/${TAG_NAME}.info" || true
          curl -s "https://sum.golang.org/lookup/github.com/yunkeweb/go-image@${TAG_NAME}" || true
