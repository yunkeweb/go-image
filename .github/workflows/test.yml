name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -shuffle=on ./...

      - name: Race
        run: go test -race ./...

      - name: Cover
        run: go test -coverprofile=coverage.out ./...

      - name: Benchmark
        run: go test -run=^$ -bench=. -benchtime=1x ./...

      - name: Fuzz
        run: |
          go test -fuzz=FuzzDecodeDataURI -fuzztime=8s .
          go test -fuzz=FuzzParseJPEGExif -fuzztime=8s .
          go test -fuzz=FuzzDecodeGIF -fuzztime=8s .
          go test -fuzz=FuzzDecodeWebP -fuzztime=8s .
          go test -fuzz=FuzzParseColor -fuzztime=8s .
          go test -fuzz=FuzzDecodeBytes -fuzztime=5s .
          go test -fuzz=FuzzVP8LRoundTrip -fuzztime=5s ./encoder

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build docs
        run: npm run docs:build
