name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -shuffle=on ./...

      - name: Race
        run: go test -race ./...

      - name: Cover
        run: go test -coverprofile=coverage.out ./...

      - name: Benchmark
        run: go test -run=^$ -bench=. -benchtime=1x ./...

      - name: Fuzz
        run: |
          go test -fuzz=FuzzDecodeBytes -fuzztime=8s .
          go test -fuzz=FuzzDecodeDataURI -fuzztime=5s .
          go test -fuzz=FuzzVP8LRoundTrip -fuzztime=8s ./encoder
